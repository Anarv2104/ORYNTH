    <!-- Preload fonts if using any custom fonts -->

    <!-- High priority preload for Spline scene -->
    <link rel="preload" href="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode" as="fetch" crossorigin fetchpriority="high">

    <link rel="prefetch" href="https://unpkg.com/@splinetool/runtime" crossorigin>
